name: Ping Backend Keep-Alive

on:
  schedule:
    # Run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Random delay
        run: |
          # Random delay between 0 and 300 seconds (0–5 min)
          SLEEP_TIME=$((RANDOM % 300))
          echo "Sleeping for $SLEEP_TIME seconds..."
          sleep $SLEEP_TIME

      - name: Call Keep-Alive API
        run: |
          echo "Pinging https://kampyn.com/api/keep-alive..."
          curl --fail --silent https://kampyn.com/api/keep-alive || echo "Ping failed"